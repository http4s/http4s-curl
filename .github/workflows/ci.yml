name: Continuous Integration

on:
  pull_request:
    branches: ['**', '!update/**', '!pr/**']
  push:
    branches: ['**', '!update/**', '!pr/**']
    tags: [v*]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-20.04
          - ubuntu-22.04
          - macos-11
          - macos-12
          - windows-2022
        scala: [3, 2.13]
        java: [temurin@17]
        project: [rootJVM, rootNative]
        include:
          - os: ubuntu-latest
            experimental: yes
        exclude:
          - scala: 3
            os: windows-2022
          - project: rootJVM
    runs-on: ${{ matrix.os }}
    env:
      EXPERIMENTAL: ${{ matrix.experimental }}
    timeout-minutes: 60
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        shell: bash
        run: git config --global core.autocrlf false

      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        shell: bash
        run: sbt +update

      - name: Install libcurl (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental != 'yes'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - name: Build libcurl from source (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental == 'yes'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get purge curl
          sudo apt-get install libssl-dev autoconf libtool make wget unzip
          cd /usr/local/src
          sudo wget https://curl.se/download/curl-7.87.0.zip
          sudo unzip curl-7.87.0.zip
          cd curl-7.87.0
          sudo ./configure --with-openssl --enable-websockets
          sudo make
          sudo make install
          curl-config --version
          curl-config --protocols
          echo "LD_LIBRARY_PATH=/usr/local/lib/" >> $GITHUB_ENV

      - name: Install libcurl (windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          vcpkg integrate install
          vcpkg install --triplet x64-windows curl
          cp "C:\vcpkg\installed\x64-windows\lib\libcurl.lib" "C:\vcpkg\installed\x64-windows\lib\curl.lib"

      - name: Check that workflows are up to date
        shell: bash
        run: sbt githubWorkflowCheck

      - name: Check headers and formatting
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' headerCheckAll scalafmtCheckAll 'project /' scalafmtSbtCheck

      - name: nativeLink
        if: matrix.project == 'rootNative'
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' Test/nativeLink

      - name: Test
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' integrate

      - name: Check binary compatibility
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' mimaReportBinaryIssues

      - name: Generate API documentation
        if: matrix.java == 'temurin@17' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' doc

      - name: Check scalafix lints
        if: matrix.java == 'temurin@17' && !startsWith(matrix.scala, '3')
        shell: bash
        run: sbt 'project ${{ matrix.project }}' '++ ${{ matrix.scala }}' 'scalafixAll --check'

      - name: Make target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        shell: bash
        run: mkdir -p curl/target project/target

      - name: Compress target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        shell: bash
        run: tar cf targets.tar curl/target project/target

      - name: Upload target directories
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v5
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-${{ matrix.scala }}-${{ matrix.project }}
          path: targets.tar

  publish:
    name: Publish Artifacts
    needs: [build]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Install libcurl (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental != 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - name: Build libcurl from source (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get purge curl
          sudo apt-get install libssl-dev autoconf libtool make wget unzip
          cd /usr/local/src
          sudo wget https://curl.se/download/curl-7.87.0.zip
          sudo unzip curl-7.87.0.zip
          cd curl-7.87.0
          sudo ./configure --with-openssl --enable-websockets
          sudo make
          sudo make install
          curl-config --version
          curl-config --protocols
          echo "LD_LIBRARY_PATH=/usr/local/lib/" >> $GITHUB_ENV

      - name: Install libcurl (windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          vcpkg integrate install
          vcpkg install --triplet x64-windows curl
          cp "C:\vcpkg\installed\x64-windows\lib\libcurl.lib" "C:\vcpkg\installed\x64-windows\lib\curl.lib"

      - name: Download target directories (3, rootNative)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-3-rootNative

      - name: Inflate target directories (3, rootNative)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Download target directories (2.13, rootNative)
        uses: actions/download-artifact@v6
        with:
          name: target-${{ matrix.os }}-${{ matrix.java }}-2.13-rootNative

      - name: Inflate target directories (2.13, rootNative)
        run: |
          tar xf targets.tar
          rm targets.tar

      - name: Import signing key
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE == ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: echo $PGP_SECRET | base64 -d -i - | gpg --import

      - name: Import signing key and strip passphrase
        if: env.PGP_SECRET != '' && env.PGP_PASSPHRASE != ''
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          echo "$PGP_SECRET" | base64 -d -i - > /tmp/signing-key.gpg
          echo "$PGP_PASSPHRASE" | gpg --pinentry-mode loopback --passphrase-fd 0 --import /tmp/signing-key.gpg
          (echo "$PGP_PASSPHRASE"; echo; echo) | gpg --command-fd 0 --pinentry-mode loopback --change-passphrase $(gpg --list-secret-keys --with-colons 2> /dev/null | grep '^sec:' | cut --delimiter ':' --fields 5 | tail -n 1)

      - name: Publish
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_CREDENTIAL_HOST: ${{ secrets.SONATYPE_CREDENTIAL_HOST }}
        run: sbt tlCiRelease

  dependency-submission:
    name: Submit Dependencies
    if: github.event.repository.fork == false && github.event_name != 'pull_request'
    strategy:
      matrix:
        os: [ubuntu-22.04]
        java: [temurin@17]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Ignore line ending differences in git
        if: contains(runner.os, 'windows')
        run: git config --global core.autocrlf false

      - name: Checkout current branch (full)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Java (temurin@17)
        id: setup-java-temurin-17
        if: matrix.java == 'temurin@17'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: sbt update
        if: matrix.java == 'temurin@17' && steps.setup-java-temurin-17.outputs.cache-hit == 'false'
        run: sbt +update

      - name: Install libcurl (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental != 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - name: Build libcurl from source (ubuntu)
        if: startsWith(matrix.os, 'ubuntu') && matrix.experimental == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get purge curl
          sudo apt-get install libssl-dev autoconf libtool make wget unzip
          cd /usr/local/src
          sudo wget https://curl.se/download/curl-7.87.0.zip
          sudo unzip curl-7.87.0.zip
          cd curl-7.87.0
          sudo ./configure --with-openssl --enable-websockets
          sudo make
          sudo make install
          curl-config --version
          curl-config --protocols
          echo "LD_LIBRARY_PATH=/usr/local/lib/" >> $GITHUB_ENV

      - name: Install libcurl (windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          vcpkg integrate install
          vcpkg install --triplet x64-windows curl
          cp "C:\vcpkg\installed\x64-windows\lib\libcurl.lib" "C:\vcpkg\installed\x64-windows\lib\curl.lib"

      - name: Submit Dependencies
        uses: scalacenter/sbt-dependency-submission@v2
        with:
          modules-ignore: rootjs_3 rootjs_2.13 testserver_3 testserver_2.13 rootjvm_3 rootjvm_2.13 rootnative_3 rootnative_2.13 sbt-http4s-org-scalafix-internal_3 sbt-http4s-org-scalafix-internal_2.13 websockettestsuite_native0.5_3 websockettestsuite_native0.5_2.13 example_native0.5_3 example_native0.5_2.13 httptestsuite_native0.5_3 httptestsuite_native0.5_2.13 testcommon_native0.5_3 testcommon_native0.5_2.13
          configs-ignore: test scala-tool scala-doc-tool test-internal
